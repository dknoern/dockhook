services:
  dockhook:
    image: dknoern/dockhook:latest
    ports:
      - "8080:8080"
    environment:
      # Required
      DOCKHOOK_SECRET: ${DOCKHOOK_SECRET:?set DOCKHOOK_SECRET}
      DOCKHOOK_IMAGE: ${DOCKHOOK_IMAGE:?set DOCKHOOK_IMAGE}
      # Optional
      DOCKHOOK_SLACK_WEBHOOK: ${DOCKHOOK_SLACK_WEBHOOK:-}
      DOCKHOOK_PORT: "8080"
    volumes:
      # Docker socket gives dockhook access to the host daemon
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
